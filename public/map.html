<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南港高工樹木地圖</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }
    #gated { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    [hidden] { display: none !important; }
    #gate { max-width: 420px; margin: 60px auto; padding: 24px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif; text-align: center; }
    #gate-status { color: #555; min-height: 1.4em; }
    #bar { padding: 8px 10px; background: #fff; border-bottom: 1px solid #ccc; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    #bar select, #bar button { font-size: 15px; padding: 6px 10px; cursor: pointer; }
    #bar button.active { background: #ff6d00; color: #fff; border: 1px solid #c43e00; }
    #bar button.primary { background: #2e7d32; color: #fff; border: 0; border-radius: 4px; }
    #stats { color: #333; }
    #message { color: #b26a00; min-height: 1.3em; padding: 0 10px 6px; font-size: 14px; background: #fff; }
    #message.error { color: #c62828; }
    #map { flex: 1; min-height: 0; }
    .legend { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; color: #444; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px #888; }
    .popup button { display: block; width: 100%; margin-top: 6px; padding: 6px; font-size: 14px; cursor: pointer; }
    .popup a { display: block; margin-top: 6px; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="gate">
    <h1>教師登入</h1>
    <p id="gate-status">載入中…</p>
    <div id="gate-button" style="display:flex; justify-content:center"></div>
    <p style="color:#888; font-size:13px">此頁僅供老師使用。學生請掃樹上的 QRCode。</p>
  </div>
  <div id="gated" hidden>
  <div id="bar">
    <a href="./teacher.html" data-embed-hide>← 教師端</a>
    <strong>南港高工樹木地圖</strong>
    <label>樹種
      <select id="species-filter"><option value="">全部</option></select>
    </label>
    <button type="button" id="box-select">框選加入清單</button>
    <button type="button" id="add-filtered">篩選結果全部加入</button>
    <button type="button" class="primary" id="make-labels">產生 QRCode 標籤</button>
    <button type="button" id="clear-list">清空清單</button>
    <label>著色
      <select id="color-mode">
        <option value="posted">貼牌狀態</option>
        <option value="height">樹高</option>
      </select>
    </label>
    <button type="button" id="reload-summary">重新載入量測</button>
    <span id="stats">載入中…</span>
    <span id="legend"></span>
  </div>
  <div id="message" role="status"></div>
  <div id="map"></div>
  </div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module">
    import { filterBySpecies, speciesSummary, treesInBounds } from '../src/treeData.js';
    import { colorForHeight, heightBands, matchSummary, NO_DATA_COLOR } from '../src/heightColors.js';
    // 與 heightColors.js 的 PENDING_COLOR 相同。不從那裡匯入:本頁不在離線快取,更新過渡期
    // Service Worker 可能還在供應舊版 heightColors.js,匯入新名稱會讓整頁載入失敗。
    const PENDING_COLOR = '#f57c00';
    import { API_URL, GOOGLE_CLIENT_ID } from '../src/config.js';
    import { requireTeacher } from '../src/teacherGate.js';
    import { applyEmbedMode, isEmbedded } from '../src/embed.js';
    import { buildHash } from '../src/appShell.js';
    import { campusBounds } from '../src/mapBounds.js';

    // 教師登入通過、內容顯示後才初始化地圖(Leaflet 需要容器有實際尺寸)。
    applyEmbedMode(document, window.location.search);

    await requireTeacher({ apiUrl: API_URL, clientId: GOOGLE_CLIENT_ID });

    const L = window.L;
    const KEY_POSTED = 'tree-map-posted';
    const KEY_LIST = 'tree-map-print-list';

    function loadSet(key) {
      try {
        return new Set(JSON.parse(localStorage.getItem(key) || '[]'));
      } catch (err) {
        return new Set();
      }
    }
    function saveSet(key, set) {
      try {
        localStorage.setItem(key, JSON.stringify([...set]));
      } catch (err) {
        say('無法儲存進度(瀏覽器禁止了本機儲存),重新整理後會消失', true);
      }
    }

    const posted = loadSet(KEY_POSTED);
    const printList = loadSet(KEY_LIST);

    const messageEl = document.getElementById('message');
    const statsEl = document.getElementById('stats');
    const boxButton = document.getElementById('box-select');
    const speciesSelect = document.getElementById('species-filter');

    function say(text, isError) {
      messageEl.textContent = text;
      messageEl.className = isError ? 'error' : '';
    }

    let trees = [];
    let visible = [];
    let measurements = new Map(); // 已核可:樹號 → 核可值
    let pendingByNo = new Map(); // 待核可:樹號 → 筆數
    let colorMode = 'posted';
    const markers = new Map();
    const markerLayer = L.layerGroup();
    let selectMode = false;
    let corner = null;
    let cornerMarker = null;

    function updateStats() {
      const total = trees.length;
      statsEl.textContent =
        `共 ${total} 棵(顯示 ${visible.length})· 已核可 ${measurements.size} · 待核可 ${pendingByNo.size} · 已貼牌 ${posted.size} · 列印清單 ${printList.size}`;
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.textContent = '';
      const items = colorMode === 'height'
        ? [{ color: NO_DATA_COLOR, label: '未量測' }, { color: PENDING_COLOR, label: '待核可' }, ...heightBands()]
        : [{ color: '#9e9e9e', label: '未貼牌' }, { color: '#2e7d32', label: '已貼牌' }];
      for (const item of items) {
        const wrap = document.createElement('span');
        wrap.className = 'legend';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = item.color;
        wrap.append(dot, item.label);
        legend.append(wrap);
      }
      const ring = document.createElement('span');
      ring.className = 'legend';
      const ringDot = document.createElement('span');
      ringDot.className = 'dot';
      ringDot.style.background = '#9e9e9e';
      ringDot.style.boxShadow = '0 0 0 3px #ff6d00';
      ring.append(ringDot, '在列印清單');
      legend.append(ring);
    }

    function fillFor(no) {
      if (colorMode === 'height') {
        const m = measurements.get(no);
        if (m) return colorForHeight(m.height);
        return pendingByNo.has(no) ? PENDING_COLOR : NO_DATA_COLOR;
      }
      return posted.has(no) ? '#2e7d32' : '#9e9e9e';
    }

    function refreshAllStyles() {
      for (const [no, marker] of markers) marker.setStyle(styleFor(no));
      updateStats();
    }

    function styleFor(no) {
      const inList = printList.has(no);
      return {
        radius: inList ? 7 : 5,
        fillColor: fillFor(no),
        fillOpacity: 0.95,
        color: inList ? '#ff6d00' : '#ffffff',
        weight: inList ? 3 : 1,
      };
    }

    function refreshMarker(no) {
      const marker = markers.get(no);
      if (marker) marker.setStyle(styleFor(no));
      updateStats();
    }

    function buildPopup(tree) {
      const box = document.createElement('div');
      box.className = 'popup';

      const title = document.createElement('strong');
      title.textContent = `樹號 ${tree.no}`;
      const species = document.createElement('div');
      species.textContent = tree.sp;

      const listBtn = document.createElement('button');
      const postedBtn = document.createElement('button');
      const syncLabels = () => {
        listBtn.textContent = printList.has(tree.no) ? '移出列印清單' : '加入列印清單';
        postedBtn.textContent = posted.has(tree.no) ? '取消「已貼牌」' : '標記為已貼牌';
      };
      syncLabels();

      listBtn.addEventListener('click', () => {
        if (printList.has(tree.no)) printList.delete(tree.no);
        else printList.add(tree.no);
        saveSet(KEY_LIST, printList);
        syncLabels();
        refreshMarker(tree.no);
      });
      postedBtn.addEventListener('click', () => {
        if (posted.has(tree.no)) posted.delete(tree.no);
        else posted.add(tree.no);
        saveSet(KEY_POSTED, posted);
        syncLabels();
        refreshMarker(tree.no);
      });

      const link = document.createElement('a');
      const url = new URL('./tree.html', window.location.href);
      url.searchParams.set('treeId', tree.no);
      link.href = url.toString();
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '開啟量測頁';

      const m = measurements.get(tree.no);
      const measure = document.createElement('div');
      measure.style.margin = '6px 0';
      const waiting = pendingByNo.get(tree.no);
      if (m) {
        const girth = m.girth ? `、樹圍 ${m.girth} cm` : '';
        const date = String(m.at).slice(0, 10);
        measure.textContent = `核可樹高 ${m.height} m${girth}(${date} 量測,${m.n} 人平均)`;
      } else if (!waiting) {
        measure.textContent = '尚無量測資料';
        measure.style.color = '#777';
      }
      if (waiting) {
        const note = document.createElement('div');
        note.style.color = PENDING_COLOR;
        note.textContent = m ? `另有 ${waiting} 筆待核可` : `有 ${waiting} 筆量測,待老師核可`;
        measure.append(note);
      }

      box.append(title, species, measure, listBtn, postedBtn, link);
      return box;
    }

    function render() {
      markerLayer.clearLayers();
      markers.clear();
      visible = filterBySpecies(trees, speciesSelect.value);
      for (const tree of visible) {
        const marker = L.circleMarker([tree.y, tree.x], styleFor(tree.no));
        marker.on('click', () => {
          if (selectMode) return;
          L.popup({ closeButton: true }).setLatLng([tree.y, tree.x]).setContent(buildPopup(tree)).openOn(map);
        });
        marker.addTo(markerLayer);
        markers.set(tree.no, marker);
      }
      updateStats();
    }

    const map = L.map('map', { preferCanvas: true, maxZoom: 21, zoomSnap: 0.5 });
    map.attributionControl.setPrefix(false); // 移除指向 leafletjs.com 的外站連結:手機上誤點會離開 App 且無法返回
    const NLSC = 'https://wmts.nlsc.gov.tw/wmts';
    const attribution = '© 內政部國土測繪中心';
    const aerial = L.tileLayer(`${NLSC}/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}`, { maxNativeZoom: 19, maxZoom: 21, attribution });
    const emap = L.tileLayer(`${NLSC}/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}`, { maxNativeZoom: 19, maxZoom: 21, attribution });
    aerial.addTo(map);
    L.control.layers({ '航照圖': aerial, '電子地圖': emap }, {}, { collapsed: true }).addTo(map);
    markerLayer.addTo(map);

    function endSelect() {
      selectMode = false;
      corner = null;
      boxButton.classList.remove('active');
      boxButton.textContent = '框選加入清單';
      if (cornerMarker) {
        map.removeLayer(cornerMarker);
        cornerMarker = null;
      }
    }

    boxButton.addEventListener('click', () => {
      if (selectMode) {
        endSelect();
        say('');
        return;
      }
      selectMode = true;
      boxButton.classList.add('active');
      boxButton.textContent = '取消框選';
      say('框選中:先點地圖上的一個角,再點對角,框內(符合目前樹種篩選)的樹會全部加入清單。按 Esc 取消。');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && selectMode) {
        endSelect();
        say('');
      }
    });

    map.on('click', (e) => {
      if (!selectMode) return;
      if (!corner) {
        corner = e.latlng;
        cornerMarker = L.circleMarker(corner, { radius: 6, color: '#ff6d00', fillColor: '#ff6d00', fillOpacity: 1 }).addTo(map);
        say('已選第一個角,請點對角');
        return;
      }
      const bounds = L.latLngBounds(corner, e.latlng);
      const rect = L.rectangle(bounds, { color: '#ff6d00', weight: 2, fillOpacity: 0.1 }).addTo(map);
      setTimeout(() => map.removeLayer(rect), 1500);
      const inside = treesInBounds(visible, {
        south: bounds.getSouth(),
        west: bounds.getWest(),
        north: bounds.getNorth(),
        east: bounds.getEast(),
      });
      inside.forEach((t) => printList.add(t.no));
      saveSet(KEY_LIST, printList);
      inside.forEach((t) => refreshMarker(t.no));
      endSelect();
      say(`框內 ${inside.length} 棵已加入清單,清單共 ${printList.size} 棵`);
    });

    document.getElementById('add-filtered').addEventListener('click', () => {
      visible.forEach((t) => printList.add(t.no));
      saveSet(KEY_LIST, printList);
      visible.forEach((t) => refreshMarker(t.no));
      say(`已加入目前顯示的 ${visible.length} 棵,清單共 ${printList.size} 棵`);
    });

    document.getElementById('clear-list').addEventListener('click', () => {
      if (printList.size === 0) return;
      if (!window.confirm(`確定清空列印清單(${printList.size} 棵)?`)) return;
      const cleared = [...printList];
      printList.clear();
      saveSet(KEY_LIST, printList);
      cleared.forEach(refreshMarker);
      say('已清空列印清單');
    });

    document.getElementById('make-labels').addEventListener('click', () => {
      if (printList.size === 0) {
        say('列印清單是空的,請先點樹「加入列印清單」或用「框選加入清單」', true);
        return;
      }
      // 內嵌在殼層時,自己導航 iframe 會讓殼層的分頁狀態失真,改由殼層切到「標籤」分頁
      if (isEmbedded(window.location.search) && window.top !== window) {
        window.top.location.hash = buildHash('teacher', 'labels');
        return;
      }
      window.location.href = './qrcodes.html';
    });

    let loadingSummary = false;
    /** 地圖鎖在校園範圍:拖不出去、也縮不到比校園更小。 */
    function lockToCampus() {
      const box = campusBounds(trees);
      if (!box) return;
      map.options.maxBoundsViscosity = 1;
      map.setMaxBounds(box);
      map.setMinZoom(map.getBoundsZoom(box));
    }

    async function loadSummary() {
      if (loadingSummary) return;
      if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
        say('尚未設定後端網址,無法載入量測值', true);
        return;
      }
      loadingSummary = true;
      const button = document.getElementById('reload-summary');
      button.disabled = true;
      button.textContent = '載入中…';
      try {
        const res = await fetch(`${API_URL}?action=summary`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body = await res.json();
        if (body.status !== 'ok') throw new Error(body.error || '後端回應異常');
        const { byNo, measured, ignored, pendingByNo: waiting } = matchSummary(trees, body.trees, body.pending);
        measurements = byNo;
        pendingByNo = waiting || new Map(); // 舊版 heightColors.js 沒有 pendingByNo
        refreshAllStyles();
        const ignoredNote = ignored > 0 ? `(另有 ${ignored} 棵的量測對不到官方樹號,已略過)` : '';
        say(`已載入 ${measured} 棵已核可、${pendingByNo.size} 棵待核可的樹${ignoredNote}。資料更新時間 ${String(body.generatedAt).slice(0, 19).replace('T', ' ')} UTC`);
      } catch (err) {
        say(`載入量測值失敗(地圖仍可使用):${err.message}`, true);
      } finally {
        loadingSummary = false;
        button.disabled = false;
        button.textContent = '重新載入量測';
      }
    }

    document.getElementById('reload-summary').addEventListener('click', loadSummary);
    document.getElementById('color-mode').addEventListener('change', (e) => {
      colorMode = e.target.value;
      renderLegend();
      refreshAllStyles();
      if (colorMode === 'height' && measurements.size === 0 && pendingByNo.size === 0) loadSummary();
    });

    speciesSelect.addEventListener('change', () => {
      say('');
      render();
    });

    try {
      const res = await fetch('../data/nkhs-trees.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      trees = data.trees;

      for (const { name, count } of speciesSummary(trees)) {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = `${name}(${count})`;
        speciesSelect.append(option);
      }

      const bounds = L.latLngBounds(trees.map((t) => [t.y, t.x]));
      map.fitBounds(bounds, { padding: [20, 20] });
      lockToCampus();
      renderLegend();
      render();
      loadSummary();
    } catch (err) {
      statsEl.textContent = '';
      say(`載入樹木資料失敗:${err.message}`, true);
    }
  </script>
</body>
</html>
