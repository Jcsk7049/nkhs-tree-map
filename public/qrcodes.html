<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>樹木 QRCode 標籤產生器</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    #gate { max-width: 420px; margin: 60px auto; padding: 24px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif; text-align: center; }
    #gate-status { color: #555; min-height: 1.4em; }
    body { font-family: sans-serif; margin: 0; padding: 16px; color: #1b1b1b; }
    .tool { max-width: 860px; margin: 0 auto 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .hint { color: #555; font-size: 14px; margin: 0 0 16px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 0 0 14px; padding: 12px 14px; }
    legend { font-weight: bold; padding: 0 6px; }
    label { display: block; font-size: 14px; margin-top: 8px; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; font-size: 16px; }
    textarea { min-height: 120px; font-family: monospace; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > label { flex: 1 1 110px; }
    button { padding: 10px 16px; font-size: 16px; margin: 10px 8px 0 0; cursor: pointer; }
    button.primary { background: #2e7d32; color: #fff; border: 0; border-radius: 4px; }
    #message { min-height: 1.4em; margin: 8px 0; font-size: 14px; }
    #message.error { color: #c62828; }
    #message.warn { color: #b26a00; }

    .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; max-width: 190mm; margin: 0 auto; }
    .label { border: 1px dashed #888; padding: 4mm; text-align: center; break-inside: avoid; page-break-inside: avoid; }
    .label svg { width: 100%; height: auto; display: block; margin: 0 auto; }
    .label .id { font-size: 22px; font-weight: bold; margin-top: 2mm; word-break: break-all; }
    .label .sp { font-size: 14px; margin-top: 1mm; }
    .label .cap { font-size: 11px; color: #444; margin-top: 1mm; }
    #from-map { display: none; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }
    #from-map button { margin: 6px 0 0; padding: 4px 10px; font-size: 14px; }
    .check { display: flex; align-items: center; gap: 6px; }
    .check input { width: auto; }

    @page { size: A4; margin: 10mm; }
    @media print {
      body { padding: 0; }
      .tool { display: none; }
      .label { border: 1px dashed #999; }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="gate">
    <h1>教師登入</h1>
    <p id="gate-status">載入中…</p>
    <div id="gate-button" style="display:flex; justify-content:center"></div>
    <p style="color:#888; font-size:13px">此頁僅供老師使用。學生請掃樹上的 QRCode。</p>
  </div>
  <div id="gated" hidden>
  <div class="tool">
    <p class="hint" data-embed-hide><a href="./teacher.html">← 教師端</a> ｜ <a href="./map.html">回樹木地圖(在地圖上選樹,清單會自動帶到這裡)</a></p>
    <h1>樹木 QRCode 標籤產生器</h1>
    <p class="hint">產生後按「列印」,印表機選「另存為 PDF」或直接印在貼紙上。QR 內容是各樹的量測登記網址。</p>

    <fieldset>
      <legend>1. 量測頁面網址</legend>
      <label>學生掃碼後會開啟這個網址(日後換網域時改這裡再重印)
        <input type="text" id="base-url" />
      </label>
    </fieldset>

    <div id="from-map"></div>

    <fieldset>
      <legend>2. 樹編號</legend>
      <p class="hint">只能用教育部校園樹木地圖的<strong>官方樹號</strong>(例如 43667),不是官方樹號的不會產生標籤。最方便的做法:在樹木地圖上框選,清單會自動帶到這裡。</p>
      <label>官方樹號清單(每行一個,也可用逗號分隔;重複的會自動合併)
        <textarea id="id-list" placeholder="43667&#10;43020"></textarea>
      </label>
      <label class="check"><input type="checkbox" id="walk-order" checked />
        依地圖座標排序(北到南、蛇行,貼牌時走一圈不用來回跑)</label>
    </fieldset>

    <button type="button" class="primary" id="generate">產生標籤</button>
    <button type="button" id="print" disabled>列印 / 另存 PDF</button>
    <div id="message" role="status"></div>
  </div>

  <div class="sheet" id="sheet"></div>
  </div>

  <script type="module">
    import qrcode from './vendor/qrcode.mjs';
    import { parseIdList, buildTreeUrl, MAX_LABELS, partitionOfficial, takePrintOne, PRINT_ONE_KEY } from '../src/qrLabels.js';
    import { indexTrees, orderIdsForWalking } from '../src/treeData.js';
    import { API_URL, GOOGLE_CLIENT_ID } from '../src/config.js';
    import { requireTeacher } from '../src/teacherGate.js';
    import { applyEmbedMode } from '../src/embed.js';

    applyEmbedMode(document, window.location.search);

    await requireTeacher({ apiUrl: API_URL, clientId: GOOGLE_CLIENT_ID });

    const KEY_LIST = 'tree-map-print-list';
    const WALK_BAND_DEG = 0.00015; // 約 16 公尺一帶

    // 樹種快照載入失敗(例如離線)不影響產生標籤,只是標籤上不印樹種、不能依座標排序。
    let treeIndex = new Map();
    const snapshotReady = fetch('../data/nkhs-trees.json')
      .then((res) => (res.ok ? res.json() : Promise.reject(new Error(`HTTP ${res.status}`))))
      .then((data) => {
        treeIndex = indexTrees(data.trees);
      })
      .catch(() => {});

    const baseUrlInput = document.getElementById('base-url');
    const listInput = document.getElementById('id-list');
    const sheetEl = document.getElementById('sheet');
    const messageEl = document.getElementById('message');
    const printButton = document.getElementById('print');

    baseUrlInput.value = new URL('./tree.html', window.location.href).href;

    function say(text, kind) {
      messageEl.textContent = text;
      messageEl.className = kind || '';
    }

    function isLocalOrigin() {
      const { protocol, hostname } = window.location;
      return protocol === 'file:' || hostname === 'localhost' || hostname === '127.0.0.1';
    }

    if (isLocalOrigin()) {
      say('注意:目前是本機網址,印出來的 QR 只有這台電腦掃得到。正式列印請從正式網站開啟本頁,或在上方手動填入正式網址。', 'warn');
    }

    const fromMapEl = document.getElementById('from-map');
    function loadMapList() {
      try {
        const ids = JSON.parse(localStorage.getItem(KEY_LIST) || '[]');
        return Array.isArray(ids) ? ids.map(String) : [];
      } catch (err) {
        return [];
      }
    }
    const mapIds = loadMapList();
    if (mapIds.length > 0) {
      listInput.value = mapIds.join('\n');
      fromMapEl.style.display = 'block';
      fromMapEl.append(`已從地圖帶入 ${mapIds.length} 棵樹的列印清單。 `);
      const clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.textContent = '清除地圖清單';
      clearBtn.addEventListener('click', () => {
        try {
          localStorage.removeItem(KEY_LIST);
        } catch (err) {
          /* 清不掉也不影響本頁 */
        }
        listInput.value = '';
        fromMapEl.style.display = 'none';
        say('已清除地圖清單');
      });
      fromMapEl.append(clearBtn);
    }

    document.getElementById('generate').addEventListener('click', async () => {
      sheetEl.textContent = '';
      printButton.disabled = true;
      await snapshotReady;

      if (treeIndex.size === 0) {
        say('官方樹木資料還沒載入(可能沒有網路),無法確認樹號,請連上網路後重新整理本頁', 'error');
        return;
      }
      const { official, unknown } = partitionOfficial(parseIdList(listInput.value), treeIndex);
      const skipped = unknown.length > 0
        ? `。以下不是官方樹號,已略過:${unknown.slice(0, 10).join('、')}${unknown.length > 10 ? `…等 ${unknown.length} 個` : ''}`
        : '';
      let ids = official;
      if (document.getElementById('walk-order').checked) {
        ids = orderIdsForWalking(ids, treeIndex, WALK_BAND_DEG);
      }
      if (ids.length === 0) {
        say(`請先輸入官方樹號(或從樹木地圖框選帶入)${skipped}`, 'error');
        return;
      }
      if (ids.length > MAX_LABELS) {
        say(`一次最多產生 ${MAX_LABELS} 個,目前有 ${ids.length} 個,請分批`, 'error');
        return;
      }

      try {
        const fragment = document.createDocumentFragment();
        for (const id of ids) {
          const qr = qrcode(0, 'Q');
          qr.addData(buildTreeUrl(baseUrlInput.value.trim(), id));
          qr.make();

          const label = document.createElement('div');
          label.className = 'label';

          const qrBox = document.createElement('div');
          // 這段 SVG 完全由函式庫從矩陣資料組成,不含任何使用者輸入的字串。
          qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });

          const idEl = document.createElement('div');
          idEl.className = 'id';
          idEl.textContent = id;

          const capEl = document.createElement('div');
          capEl.className = 'cap';
          capEl.textContent = '掃碼登記樹高與樹圍';

          label.append(qrBox, idEl);
          const tree = treeIndex.get(id);
          if (tree) {
            const spEl = document.createElement('div');
            spEl.className = 'sp';
            spEl.textContent = tree.sp;
            label.append(spEl);
          }
          label.append(capEl);
          fragment.append(label);
        }
        sheetEl.append(fragment);
        printButton.disabled = false;
        if (isLocalOrigin()) {
          say(`已產生 ${ids.length} 張標籤${skipped}。注意:網址是本機位址,正式列印前請改成正式網址`, 'warn');
        } else {
          say(`已產生 ${ids.length} 張標籤${skipped}`, unknown.length > 0 ? 'warn' : '');
        }
      } catch (err) {
        sheetEl.textContent = '';
        say(err.message, 'error');
      }
    });

    printButton.addEventListener('click', () => window.print());

    // ---- 地圖說明框「列印這棵的 QR 標籤」:只放這一棵並自動產生(不動地圖列印清單) ----
    function applyPrintOne() {
      const id = takePrintOne((() => { try { return localStorage; } catch (err) { return null; } })());
      if (!id) return;
      listInput.value = id;
      fromMapEl.style.display = 'none';
      say(`已帶入樹號 ${id},正在產生標籤…`);
      document.getElementById('generate').click();
    }
    applyPrintOne();
    // 殼層裡 QR 分頁早已開著時,地圖存入後這裡會收到 storage 事件。
    window.addEventListener('storage', (event) => {
      if (event.key === PRINT_ONE_KEY && event.newValue) applyPrintOne();
    });
  </script>
</body>
</html>
