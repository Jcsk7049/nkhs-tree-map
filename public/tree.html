<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.json" />
  <title>樹木量測登記</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    .hint { font-weight: normal; color: #666; font-size: 13px; }
    input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    #studentCode { letter-spacing: 2px; text-transform: uppercase; }
    button { margin-top: 20px; padding: 12px; width: 100%; font-size: 16px; }
    button[disabled], input[disabled] { opacity: 0.5; }
    #result { margin-top: 16px; padding: 12px; background: #e8f5e9; display: none; }
    #errors { color: #c62828; margin-top: 8px; }
    #banner { display: none; margin-bottom: 16px; padding: 12px; border-radius: 4px;
              background: #fff3e0; border: 1px solid #ef6c00; color: #e65100; }
    #history { margin-top: 28px; border-top: 1px solid #ddd; padding-top: 8px; }
    #history h2 { font-size: 18px; margin: 8px 0; }
  </style>
</head>
<body>
  <div id="banner"></div>
  <h1 id="tree-title">樹木量測登記</h1>

  <form id="measurement-form" autocomplete="off">
    <label>班級座號 <span class="hint">(例:301-12)</span>
      <input type="text" id="studentClassNo" required />
    </label>
    <label>通行碼 <span class="hint">(老師發給你的 7 碼,例:K7M-2QX-4)</span>
      <input type="text" id="studentCode" autocapitalize="characters" autocorrect="off" spellcheck="false" required />
    </label>
    <label>仰角(度) <input type="number" id="angleDeg" step="0.1" required /></label>
    <label>水平距離(公尺) <input type="number" id="distanceM" step="0.01" required /></label>
    <label>樹圍(公分) <input type="number" id="girthCm" step="0.1" required /></label>
    <div id="errors"></div>
    <button type="submit" id="submit-button">送出</button>
  </form>
  <div id="result"></div>

  <section id="history" hidden>
    <h2>這棵樹的歷年量測</h2>
    <div id="history-body">載入中…</div>
  </section>

  <script type="module">
    import { validateMeasurementInput } from '../src/calc.js';
    import { submitMeasurement, syncPendingQueue } from '../src/submit.js';
    import { buildMeasurementRecord, getTreeIdFromUrl } from '../src/treePage.js';
    import { listPending } from '../src/offlineQueue.js';
    import { fetchHistory, renderHistory } from '../src/trendView.js';
    import { isValidCodeFormat, normalizeClassNo, normalizeCode } from '../src/studentCode.js';
    import { API_URL } from '../src/config.js';

    /** 佔位字串一律以 PASTE_ 開頭;用前綴判斷,才不會被「整份取代佔位字串」的操作誤判成已設定。 */
    const NOT_CONFIGURED = !API_URL || API_URL.indexOf('PASTE_') === 0;

    const LAST_CLASS_NO_KEY = 'tree-map-last-class-no';

    const form = document.getElementById('measurement-form');
    const submitButton = document.getElementById('submit-button');
    const errorsEl = document.getElementById('errors');
    const resultEl = document.getElementById('result');
    const bannerEl = document.getElementById('banner');
    const classNoInput = document.getElementById('studentClassNo');
    const codeInput = document.getElementById('studentCode');

    function showBanner(message) {
      bannerEl.textContent = message;
      bannerEl.style.display = 'block';
    }

    function hideBanner() {
      bannerEl.style.display = 'none';
    }

    function showResult(message) {
      resultEl.style.display = 'block';
      resultEl.textContent = message;
    }

    function setFormEnabled(enabled) {
      form.querySelectorAll('input, button').forEach((el) => { el.disabled = !enabled; });
    }

    const treeId = getTreeIdFromUrl(window.location.search);

    // 歷年趨勢圖:純讀取、不需通行碼。載入失敗(含離線)只影響這一區,不影響填表與離線暫存。
    const historySection = document.getElementById('history');
    const historyBody = document.getElementById('history-body');
    async function loadHistory() {
      if (NOT_CONFIGURED || !treeId) return;
      historySection.hidden = false;
      try {
        renderHistory(historyBody, await fetchHistory(API_URL, treeId, fetch));
      } catch (err) {
        historyBody.textContent = navigator.onLine
          ? '暫時無法載入歷年量測(不影響填寫)'
          : '目前離線,無法載入歷年量測(不影響填寫)';
      }
    }

    // --- 啟動檢查 ---
    setFormEnabled(!NOT_CONFIGURED && Boolean(treeId));

    if (NOT_CONFIGURED) {
      showBanner('系統尚未設定完成,請聯絡老師(System not configured yet, contact your teacher)');
    }

    if (treeId) {
      document.getElementById('tree-title').textContent = `樹木量測登記 — ${treeId}`;
    } else {
      errorsEl.textContent = '找不到樹木編號,請重新掃描 QRCode';
    }

    try {
      classNoInput.value = localStorage.getItem(LAST_CLASS_NO_KEY) || '';
    } catch (err) {
      // 無痕模式讀不到就算了,只是少一個預填。
    }

    if ('serviceWorker' in navigator) {
      // 註冊失敗(舊瀏覽器、無痕模式、非安全內容)只代表沒有離線能力,線上功能照常;
      // 不接住的話會變成一個沒人處理的 promise rejection。
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('[tree-map] Service Worker 註冊失敗,離線功能無法使用', err);
      });
    }

    // --- 待同步佇列 ---

    /** 把同步結果講清楚 —— 特別是被伺服器退掉(dropped)的筆數,不能無聲消失。 */
    function reportSyncResult({ synced, dropped, failed }) {
      console.info('[tree-map] 同步結果', { synced, dropped, failed });

      const parts = [];
      if (synced > 0) parts.push(`已同步 ${synced} 筆`);
      if (dropped > 0) {
        parts.push(`有 ${dropped} 筆被伺服器退回(通行碼錯誤、已被停用或資料不合法,已移除),請找老師確認`);
      }
      if (failed > 0) parts.push(`還有 ${failed} 筆等待下次連線再試`);
      if (parts.length > 0) {
        showBanner(parts.join(';'));
      } else {
        hideBanner();
      }
    }

    async function flushPendingQueue() {
      if (NOT_CONFIGURED) {
        return;
      }
      try {
        reportSyncResult(await syncPendingQueue(fetch, API_URL));
      } catch (err) {
        console.error('[tree-map] 背景同步失敗', err);
      }
    }

    /** 開頁時若還有待同步資料,直接讓使用者看到,不要讓它靜靜躺在本機沒人知道。 */
    async function announcePendingOnLoad() {
      try {
        const pending = await listPending();
        if (pending.length > 0) {
          showBanner(`本機還有 ${pending.length} 筆尚未上傳的紀錄,連上網路後系統會自動補送。`);
          await flushPendingQueue();
        }
      } catch (err) {
        console.warn('[tree-map] 無法讀取待同步佇列', err);
      }
    }

    announcePendingOnLoad();

    // --- 送出 ---

    /** 後端拒絕時給學生看的白話說明。 */
    function explainRejection(code, error) {
      if (code === 'STUDENT_REJECTED') {
        return '班級座號或通行碼不對,或這位同學已被停用。請對照老師發的紙條再試一次,還是不行就找老師。';
      }
      if (code === 'STUDENT_LOCKED') {
        return '這個班級座號輸入錯誤太多次,已暫時鎖定。請 5 分鐘後再試,或請老師重設通行碼。';
      }
      return `伺服器拒絕了這筆資料:${error || '原因不明'},請確認輸入後重新送出`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!treeId || NOT_CONFIGURED) {
        return;
      }

      const formValues = {
        studentClassNo: classNoInput.value,
        studentCode: codeInput.value,
        angleDeg: Number(document.getElementById('angleDeg').value),
        distanceM: Number(document.getElementById('distanceM').value),
        girthCm: Number(document.getElementById('girthCm').value),
      };

      // required 擋不掉整串空白;通行碼的檢查碼讓學生「打錯字」時離線也能立刻發現。
      const textErrors = [];
      if (!normalizeClassNo(formValues.studentClassNo)) textErrors.push('請填寫班級座號');
      if (!normalizeCode(formValues.studentCode)) {
        textErrors.push('請填寫通行碼');
      } else if (!isValidCodeFormat(normalizeCode(formValues.studentCode))) {
        textErrors.push('通行碼打錯了(應該是 7 個字,例如 K7M-2QX-4),請對照老師發的紙條');
      }
      const validation = validateMeasurementInput(formValues);
      const allErrors = textErrors.concat(validation.errors);
      if (allErrors.length > 0) {
        errorsEl.textContent = allErrors.join('、');
        return;
      }
      errorsEl.textContent = '';

      // 送出期間鎖住按鈕,避免手殘連點兩下送出兩筆。
      submitButton.disabled = true;
      submitButton.textContent = '送出中…請稍候(約 3-5 秒)';
      try {
        const record = buildMeasurementRecord(formValues, treeId);
        try {
          localStorage.setItem(LAST_CLASS_NO_KEY, record.studentClassNo);
        } catch (err) {
          // 記不住只是少一個預填,不影響送出。
        }
        const { status, code, error, studentName } = await submitMeasurement(record, fetch, API_URL);

        if (status === 'sent') {
          hideBanner();
          const who = studentName ? `(填寫人:${studentName})` : '';
          showResult(`送出成功!計算樹高:${record.calculatedHeight} 公尺${who}`);
          codeInput.value = ''; // 共用平板:通行碼不留在畫面上
          loadHistory();
        } else if (status === 'queued') {
          showResult(`已存本機,計算樹高:${record.calculatedHeight} 公尺,恢復網路後將自動同步`);
          codeInput.value = '';
        } else {
          // rejected:後端永久拒絕或學生被鎖定,資料沒有被保留,必須讓學生知道。
          errorsEl.textContent = explainRejection(code, error);
        }
      } catch (err) {
        // 例如無痕模式下 IndexedDB 不可用、儲存空間已滿 —— enqueue 本身就會爆。
        console.error('[tree-map] 送出失敗', err);
        errorsEl.textContent = '送出時發生錯誤,請截圖回報老師(An error occurred, please screenshot and report to your teacher)';
      } finally {
        submitButton.textContent = '送出';
        submitButton.disabled = false;
        setFormEnabled(!NOT_CONFIGURED && Boolean(treeId));
      }
    });

    window.addEventListener('online', () => {
      flushPendingQueue();
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>
