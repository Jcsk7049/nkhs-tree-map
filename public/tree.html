<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.json" />
  <title>樹木量測登記</title>
  <!-- Google Identity Services:登入用。離線時這支 CDN 腳本載不到,
       此時改用上次登入存下來的權杖讓學生仍能離線填寫(見下方 restoreSavedToken)。 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 12px; width: 100%; font-size: 16px; }
    button[disabled], input[disabled] { opacity: 0.5; }
    #result { margin-top: 16px; padding: 12px; background: #e8f5e9; display: none; }
    #errors { color: #c62828; margin-top: 8px; }
    #banner { display: none; margin-bottom: 16px; padding: 12px; border-radius: 4px;
              background: #fff3e0; border: 1px solid #ef6c00; color: #e65100; }
    #signin { margin: 16px 0; padding: 12px; border: 1px dashed #999; border-radius: 4px; }
    #signin-status { margin-bottom: 8px; color: #555; }
    #history { margin-top: 28px; border-top: 1px solid #ddd; padding-top: 8px; }
    #history h2 { font-size: 18px; margin: 8px 0; }
  </style>
</head>
<body>
  <div id="banner"></div>
  <h1 id="tree-title">樹木量測登記</h1>

  <div id="signin">
    <div id="signin-status">請先用校內 Google 帳號登入後才能填寫。</div>
    <div id="gsi-button"></div>
  </div>

  <form id="measurement-form">
    <label>姓名 <input type="text" id="studentName" required /></label>
    <label>班級座號 <input type="text" id="studentClassNo" required /></label>
    <label>仰角(度) <input type="number" id="angleDeg" step="0.1" required /></label>
    <label>水平距離(公尺) <input type="number" id="distanceM" step="0.01" required /></label>
    <label>樹圍(公分) <input type="number" id="girthCm" step="0.1" required /></label>
    <div id="errors"></div>
    <button type="submit" id="submit-button">送出</button>
  </form>
  <div id="result"></div>

  <section id="history" hidden>
    <h2>這棵樹的歷年量測</h2>
    <div id="history-body">載入中…</div>
  </section>

  <script type="module">
    import { validateMeasurementInput } from '../src/calc.js';
    import { submitMeasurement, syncPendingQueue } from '../src/submit.js';
    import { buildMeasurementRecord, getTreeIdFromUrl } from '../src/treePage.js';
    import { listPending } from '../src/offlineQueue.js';
    import { fetchHistory, renderHistory } from '../src/trendView.js';

    // === 部署前必須由人類填入的設定(見 DEPLOY.md / apps-script/README.md) ===
    const API_URL = 'https://script.google.com/macros/s/AKfycbwzmAZenLHps_WO6345Q3rL6Tp0KlKWZcSv-Z1RnYqrB_ABC8X8IhZU9HWXRiFYcLE4/exec';
    const GOOGLE_CLIENT_ID = '315947250270-9519c1ga10lm01ljoccu8h4c7dv3a5uh.apps.googleusercontent.com';

    /** 佔位字串一律以 PASTE_ 開頭;用前綴判斷,才不會被「整份取代佔位字串」的操作誤判成已設定。 */
    const isUnconfigured = (value) => !value || value.indexOf('PASTE_') === 0;
    const NOT_CONFIGURED = isUnconfigured(API_URL) || isUnconfigured(GOOGLE_CLIENT_ID);

    const TOKEN_STORAGE_KEY = 'tree-map-id-token';

    const form = document.getElementById('measurement-form');
    const submitButton = document.getElementById('submit-button');
    const errorsEl = document.getElementById('errors');
    const resultEl = document.getElementById('result');
    const bannerEl = document.getElementById('banner');
    const signinEl = document.getElementById('signin');
    const signinStatusEl = document.getElementById('signin-status');

    let idToken = null;
    // 身分關卡過不了時暫停背景自動重送,避免每次 online 都對著同一個必敗的條件重打後端。
    let syncPausedByAuth = false;
    // 記住暫停的原因,`online` 事件才能再顯示同一段(而不是一律說「登入已過期」)。
    let syncPauseMessage = '';

    /**
     * 兩種「資料留著、但現在送不出去」的狀況,提示對象完全不同:
     *   AUTH_EXPIRED  — 權杖過期,學生自己重新登入就能解決。
     *   AUTH_REJECTED — 身分被後端拒絕,最常見的原因是 tree.html 與 Code.gs 兩處的
     *                   GOOGLE_CLIENT_ID 沒貼成同一個(或網域設定不符)。學生再怎麼重新登入
     *                   都不會過,只有老師改部署設定才救得了,所以必須明講「找老師」。
     * 兩者的資料都保留在本機佇列,設定/登入修好後會自動補送。
     */
    const AUTH_PAUSE_MESSAGES = {
      AUTH_EXPIRED: '登入已過期,請重新登入後才能把尚未上傳的紀錄送出(資料仍保留在這台裝置上)。',
      AUTH_REJECTED:
        '帳號驗證失敗,請聯絡老師確認系統設定(Account verification failed, please contact your teacher to check the system configuration)。尚未上傳的紀錄仍保留在這台裝置上,設定修正後會自動補送。',
    };

    /** 暫停背景同步並顯示對應提示;資料一律留在佇列。 */
    function pauseSyncForAuth(code) {
      syncPausedByAuth = true;
      syncPauseMessage = AUTH_PAUSE_MESSAGES[code] || AUTH_PAUSE_MESSAGES.AUTH_EXPIRED;
      showBanner(syncPauseMessage);
    }

    function showBanner(message) {
      bannerEl.textContent = message;
      bannerEl.style.display = 'block';
    }

    function hideBanner() {
      bannerEl.style.display = 'none';
    }

    function showResult(message) {
      resultEl.style.display = 'block';
      resultEl.textContent = message;
    }

    function setFormEnabled(enabled) {
      form.querySelectorAll('input, button').forEach((el) => { el.disabled = !enabled; });
    }

    const treeId = getTreeIdFromUrl(window.location.search);

    // 歷年趨勢圖:純讀取、不需登入。載入失敗(含離線)只影響這一區,不影響填表與離線暫存。
    const historySection = document.getElementById('history');
    const historyBody = document.getElementById('history-body');
    async function loadHistory() {
      if (NOT_CONFIGURED || !treeId) return;
      historySection.hidden = false;
      try {
        renderHistory(historyBody, await fetchHistory(API_URL, treeId, fetch));
      } catch (err) {
        historyBody.textContent = navigator.onLine
          ? '暫時無法載入歷年量測(不影響填寫)'
          : '目前離線,無法載入歷年量測(不影響填寫)';
      }
    }

    /** 表單只有在「設定完成 + 有樹編號 + 已登入」三個條件都成立時才可填寫。 */
    function refreshFormState() {
      setFormEnabled(!NOT_CONFIGURED && Boolean(treeId) && Boolean(idToken));
    }

    // --- 啟動檢查 ---
    setFormEnabled(false);

    if (NOT_CONFIGURED) {
      showBanner('系統尚未設定完成,請聯絡老師(System not configured yet, contact your teacher)');
    }

    if (treeId) {
      document.getElementById('tree-title').textContent = `樹木量測登記 — ${treeId}`;
    } else {
      errorsEl.textContent = '找不到樹木編號,請重新掃描 QRCode';
    }

    if ('serviceWorker' in navigator) {
      // 註冊失敗(舊瀏覽器、無痕模式、非安全內容)只代表沒有離線能力,線上功能照常;
      // 不接住的話會變成一個沒人處理的 promise rejection。
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('[tree-map] Service Worker 註冊失敗,離線功能無法使用', err);
      });
    }

    // --- 登入(Google Identity Services) ---

    function rememberToken(token, email) {
      idToken = token;
      try {
        localStorage.setItem(TOKEN_STORAGE_KEY, JSON.stringify({ token, email, savedAt: Date.now() }));
      } catch (err) {
        // 無痕模式可能不給寫 —— 不影響這次填寫,只是下次離線開頁要重新登入。
        console.warn('[tree-map] 無法保存登入狀態', err);
      }
      signinStatusEl.textContent = `已登入:${email || '(帳號不明)'}`;
      syncPausedByAuth = false;
      syncPauseMessage = '';
      refreshFormState();
    }

    /** 從 JWT 的 payload 取 email,純粹拿來顯示;真正的驗證一律在後端做。 */
    function readEmailFromCredential(credential) {
      try {
        const payload = JSON.parse(atob(credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return payload.email || '';
      } catch (err) {
        return '';
      }
    }

    function handleCredentialResponse(response) {
      try {
        const credential = response && response.credential;
        if (!credential) {
          signinStatusEl.textContent = '登入失敗,請再試一次。';
          return;
        }
        rememberToken(credential, readEmailFromCredential(credential));
        hideBanner();
        flushPendingQueue();
      } catch (err) {
        console.error('[tree-map] 處理登入回應時發生錯誤', err);
        signinStatusEl.textContent = '登入處理失敗,請重新整理頁面再試一次。';
      }
    }

    /**
     * 離線備援:沿用上次存下的權杖。
     * Google ID Token 約 1 小時就過期,所以這個權杖很可能已經不能用了 —— 但重點是
     * 讓學生在校園死角仍能把量測資料填完存進本機佇列,補送時若被判 AUTH_EXPIRED,
     * 資料會留在佇列並提示重新登入,不會遺失。
     */
    function restoreSavedToken() {
      try {
        const saved = JSON.parse(localStorage.getItem(TOKEN_STORAGE_KEY) || 'null');
        if (saved && saved.token) {
          idToken = saved.token;
          signinStatusEl.textContent = `已登入:${saved.email || '(帳號不明)'}(沿用上次登入)`;
          refreshFormState();
        }
      } catch (err) {
        console.warn('[tree-map] 無法讀取上次的登入狀態', err);
      }
    }

    function initGoogleSignIn() {
      if (NOT_CONFIGURED) {
        signinStatusEl.textContent = '系統尚未設定完成,無法登入。';
        return;
      }
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        signinStatusEl.textContent = idToken
          ? signinStatusEl.textContent
          : '目前無法連上 Google 登入服務(可能離線),請連上網路後重新整理頁面登入。';
        return;
      }
      try {
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse,
        });
        window.google.accounts.id.renderButton(document.getElementById('gsi-button'), {
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
        });
      } catch (err) {
        console.error('[tree-map] 初始化 Google 登入失敗', err);
        signinStatusEl.textContent = '登入元件載入失敗,請重新整理頁面再試一次。';
      }
    }

    restoreSavedToken();
    // GIS 腳本是 async defer,load 事件時才保證就緒。
    window.addEventListener('load', initGoogleSignIn);

    // --- 待同步佇列 ---

    /** 把同步結果講清楚 —— 特別是被伺服器退掉(dropped)的筆數,不能無聲消失。 */
    function reportSyncResult({ synced, dropped, failed, authPaused, authCode }) {
      console.info('[tree-map] 同步結果', { synced, dropped, failed, authPaused, authCode });

      if (authPaused) {
        pauseSyncForAuth(authCode);
        return;
      }

      const parts = [];
      if (synced > 0) parts.push(`已同步 ${synced} 筆`);
      if (dropped > 0) parts.push(`有 ${dropped} 筆被伺服器退回(資料不合法,已移除),請截圖回報老師`);
      if (failed > 0) parts.push(`還有 ${failed} 筆等待下次連線再試`);
      if (parts.length > 0) {
        showBanner(parts.join(';'));
      } else {
        hideBanner();
      }
    }

    async function flushPendingQueue() {
      if (NOT_CONFIGURED || !idToken) {
        return;
      }
      try {
        reportSyncResult(await syncPendingQueue(fetch, API_URL));
      } catch (err) {
        console.error('[tree-map] 背景同步失敗', err);
      }
    }

    /** 開頁時若還有待同步資料,直接讓使用者看到,不要讓它靜靜躺在本機沒人知道。 */
    async function announcePendingOnLoad() {
      try {
        const pending = await listPending();
        if (pending.length > 0) {
          showBanner(`本機還有 ${pending.length} 筆尚未上傳的紀錄,請確認已登入並連上網路,系統會自動補送。`);
          await flushPendingQueue();
        }
      } catch (err) {
        console.warn('[tree-map] 無法讀取待同步佇列', err);
      }
    }

    announcePendingOnLoad();

    // --- 送出 ---

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!treeId || NOT_CONFIGURED) {
        return;
      }
      if (!idToken) {
        errorsEl.textContent = '請先用校內 Google 帳號登入後再送出';
        return;
      }

      const formValues = {
        studentName: document.getElementById('studentName').value.trim(),
        studentClassNo: document.getElementById('studentClassNo').value.trim(),
        angleDeg: Number(document.getElementById('angleDeg').value),
        distanceM: Number(document.getElementById('distanceM').value),
        girthCm: Number(document.getElementById('girthCm').value),
      };

      // required 擋不掉整串空白,但空白的姓名等於沒填。
      const textErrors = [];
      if (!formValues.studentName) textErrors.push('請填寫姓名');
      if (!formValues.studentClassNo) textErrors.push('請填寫班級座號');

      const validation = validateMeasurementInput(formValues);
      const allErrors = textErrors.concat(validation.errors);
      if (allErrors.length > 0) {
        errorsEl.textContent = allErrors.join('、');
        return;
      }
      errorsEl.textContent = '';

      // 送出期間鎖住按鈕,避免手殘連點兩下送出兩筆。
      submitButton.disabled = true;
      submitButton.textContent = '送出中…請稍候(約 3-5 秒)';
      try {
        const record = { ...buildMeasurementRecord(formValues, treeId), idToken };
        const { status, code, error } = await submitMeasurement(record, fetch, API_URL);

        if (status === 'sent') {
          hideBanner();
          showResult(`送出成功!計算樹高:${record.calculatedHeight} 公尺`);
          loadHistory();
        } else if (status === 'queued') {
          showResult(
            `已存本機,計算樹高:${record.calculatedHeight} 公尺,恢復網路後將自動同步`
          );
          if (code === 'AUTH_EXPIRED' || code === 'AUTH_REJECTED') {
            pauseSyncForAuth(code);
          }
        } else {
          // rejected:伺服器永久拒絕,資料沒有被保留,必須讓學生知道要重填。
          errorsEl.textContent = `伺服器拒絕了這筆資料:${error || '原因不明'},請確認輸入後重新送出`;
        }
      } catch (err) {
        // 例如無痕模式下 IndexedDB 不可用、儲存空間已滿 —— enqueue 本身就會爆。
        console.error('[tree-map] 送出失敗', err);
        errorsEl.textContent = '送出時發生錯誤,請截圖回報老師(An error occurred, please screenshot and report to your teacher)';
      } finally {
        submitButton.textContent = '送出';
        submitButton.disabled = false;
        refreshFormState();
      }
    });

    window.addEventListener('online', () => {
      if (syncPausedByAuth) {
        // 身分關卡沒解決前重送只會再被拒一次。等重新登入(rememberToken)或老師改好設定後才恢復。
        showBanner(syncPauseMessage || AUTH_PAUSE_MESSAGES.AUTH_EXPIRED);
        return;
      }
      flushPendingQueue();
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>
