<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南港高工 校園樹木量測</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px 16px; color: #1b1b1b; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 24px; }
    .card { display: block; padding: 18px; border: 1px solid #bbb; border-radius: 8px; margin: 14px 0; text-decoration: none; color: inherit; }
    a.card:hover { background: #f1f8e9; border-color: #2e7d32; }
    .card strong { display: block; font-size: 19px; margin-bottom: 6px; }
    .card span { color: #555; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>南港高工 校園樹木量測</h1>
    <a class="card" href="./app.html">
      <strong>開啟 App →</strong>
      <span>學生與老師的統一入口,可安裝到手機/平板主畫面。</span>
    </a>
    <div class="card">
      <strong>學生</strong>
      <span>請直接掃描樹上貼的 QRCode,輸入班級座號與老師發給你的通行碼,就能登記這棵樹的量測。沒有通行碼請找老師。</span>
    </div>
    <a class="card" href="./teacher.html">
      <strong>教師端 →</strong>
      <span>學生名單與通行碼、樹木地圖、QRCode 標籤。需要用教師的 Google 帳號登入。</span>
    </a>
  </main>
</body>
</html>
